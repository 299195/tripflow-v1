[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripflow"
version = "0.1.0"
description = "TripFlow V1 single-user travel planning backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=0.1"]

[project.scripts]
tripflow-api = "tripflow.api:run"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tripflow*", "tripflow_amap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

